parameters:
    strava.redirect_uri: '%env(APP_URL)%/oauth/strava/callback'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Essais de connexion : un seul compteur e-mail + IP (security.yaml, login_throttling ; voir CLAUDE.md)
    App\Security\LoginRateLimiter:
        arguments:
            $factory: '@limiter.login'
            $secret: '%kernel.secret%'

    App\Service\Strava\StravaService:
        arguments:
            $clientId: '%env(STRAVA_CLIENT_ID)%'
            $clientSecret: '%env(STRAVA_CLIENT_SECRET)%'
            $redirectUri: '%strava.redirect_uri%'
