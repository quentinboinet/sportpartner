security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Profileur et barre de debug (dev) seulement : tout le reste passe par le pare-feu principal
        dev:
            pattern: ^/(_profiler|_wdt)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: app_dashboard
            # Un seul compteur par adresse e-mail + IP, sans compteur global par IP (IP du proxy possible en
            # production) : App\Security\LoginRateLimiter, limiteur « login » de rate_limiter.yaml
            login_throttling:
                limiter: App\Security\LoginRateLimiter
            # Lien du menu du compte : logout_path() ajoute le jeton ; GET /logout sans jeton ne déconnecte pas
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/webhooks, roles: PUBLIC_ACCESS }
        - { path: ^/oauth, roles: PUBLIC_ACCESS }
        # Choix de la langue : aussi sur /login et /register (LocaleController ne renvoie que vers ce site)
        - { path: ^/switch-locale/, roles: PUBLIC_ACCESS }
        # Plan de course partagé (/p/{token}, /p/{token}/calendar.ics) : public, accès par le seul jeton
        - { path: ^/p/, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }
