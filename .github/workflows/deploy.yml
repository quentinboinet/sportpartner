name: Deploy to Alwaysdata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One run per ref at a time. Outdated PR runs are cancelled; runs on main are
# never cancelled mid-way (migrations, cache...), they queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, ctype, iconv
          coverage: none
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # .env is gitignored: bin/console (Dotenv) needs one. Dummy values only.
      - name: Create CI .env
        run: |
          cat > .env <<'EOF'
          APP_ENV=dev
          APP_DEBUG=1
          APP_SECRET=ci
          APP_URL=http://localhost
          DATABASE_URL="mysql://ci:ci@127.0.0.1:3306/ci?serverVersion=8.0&charset=utf8mb4"
          MAILER_DSN=null://null
          STRAVA_CLIENT_ID=ci
          STRAVA_CLIENT_SECRET=ci
          EOF

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Warm up dev cache (container XML for PHPStan)
        run: php bin/console cache:warmup --env=dev

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Lint container
        run: php bin/console lint:container

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint YAML
        run: php bin/console lint:yaml config

      - name: Validate Doctrine mapping
        run: php bin/console doctrine:schema:validate --skip-sync

  deploy:
    name: Deploy
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two deploys never overlap, even across workflows/refs.
    concurrency:
      group: alwaysdata-production-deploy
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ALWAYSDATA_SSH_HOST }}
          username: ${{ secrets.ALWAYSDATA_SSH_USER }}
          password: ${{ secrets.ALWAYSDATA_SSH_PASSWORD }}
          script: |
            set -e
            cd ~/www/sportpartner

            echo "==> Pull"
            git pull origin main

            echo "==> Var directories"
            mkdir -p var/log var/cache

            echo "==> Composer"
            composer install --no-dev --optimize-autoloader --no-interaction

            # Prod (debug off) reuses var/cache/prod without a freshness check, so a
            # stale container could reference classes composer just removed. Delete it
            # (rm rather than cache:clear, which would boot that stale container).
            echo "==> Clear prod cache"
            rm -rf var/cache/prod

            echo "==> Migrations"
            php bin/console doctrine:migrations:migrate --no-interaction --env=prod

            echo "==> Assets"
            php bin/console asset-map:compile --env=prod

            echo "==> Cache"
            php bin/console cache:warmup --env=prod

            echo "==> Done"
